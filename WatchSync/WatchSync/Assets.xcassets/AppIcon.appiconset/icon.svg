<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gradient for bezel -->
    <linearGradient id="bezelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <!-- Gradient for case -->
    <linearGradient id="caseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="30%" style="stop-color:#c0c0c0"/>
      <stop offset="70%" style="stop-color:#a0a0a0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <!-- Lume glow -->
    <filter id="lume" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#1a1a1a"/>

  <!-- Outer case (steel) -->
  <circle cx="512" cy="512" r="480" fill="url(#caseGradient)"/>

  <!-- Bezel (black ceramic style) -->
  <circle cx="512" cy="512" r="450" fill="url(#bezelGradient)"/>

  <!-- Bezel minute markers -->
  <g fill="#c0c0c0">
    <!-- Every minute marker on bezel -->
    <g transform="translate(512,512)">
      <!-- Main markers at 5-minute intervals -->
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(0)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(30)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(60)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(90)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(120)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(150)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(180)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(210)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(240)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(270)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(300)"/>
      <rect x="-3" y="-440" width="6" height="25" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Bezel pip at 12 (luminous triangle) -->
  <polygon points="512,85 525,115 499,115" fill="#98ff98"/>

  <!-- Inner bezel ring -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#505050" stroke-width="3"/>

  <!-- Dial (black) -->
  <circle cx="512" cy="512" r="395" fill="#0a0a0a"/>

  <!-- Chapter ring / rehaut -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="#1a1a1a" stroke-width="15"/>

  <!-- Hour markers (luminous) -->
  <g fill="#98ff98">
    <!-- 12 o'clock - triangle -->
    <polygon points="512,155 535,200 489,200"/>

    <!-- 3 o'clock - rectangle -->
    <rect x="790" y="497" width="45" height="30" rx="3"/>

    <!-- 6 o'clock - rectangle -->
    <rect x="497" y="790" width="30" height="45" rx="3"/>

    <!-- 9 o'clock - rectangle -->
    <rect x="189" y="497" width="45" height="30" rx="3"/>

    <!-- 1 o'clock - circle -->
    <circle cx="674" cy="231" r="22"/>

    <!-- 2 o'clock - circle -->
    <circle cx="793" cy="350" r="22"/>

    <!-- 4 o'clock - circle -->
    <circle cx="793" cy="674" r="22"/>

    <!-- 5 o'clock - circle -->
    <circle cx="674" cy="793" r="22"/>

    <!-- 7 o'clock - circle -->
    <circle cx="350" cy="793" r="22"/>

    <!-- 8 o'clock - circle -->
    <circle cx="231" cy="674" r="22"/>

    <!-- 10 o'clock - circle -->
    <circle cx="231" cy="350" r="22"/>

    <!-- 11 o'clock - circle -->
    <circle cx="350" cy="231" r="22"/>
  </g>

  <!-- Minute track (small markers) -->
  <g stroke="#404040" stroke-width="1">
    <g transform="translate(512,512)">
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(6)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(12)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(18)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(24)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(36)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(42)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(48)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(54)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(66)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(72)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(78)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(84)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(96)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(102)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(108)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(114)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(126)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(132)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(138)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(144)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(156)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(162)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(168)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(174)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(186)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(192)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(198)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(204)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(216)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(222)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(228)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(234)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(246)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(252)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(258)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(264)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(276)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(282)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(288)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(294)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(306)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(312)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(318)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(324)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(336)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(342)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(348)"/>
      <line x1="0" y1="-375" x2="0" y2="-360" transform="rotate(354)"/>
    </g>
  </g>

  <!-- Hour hand (Mercedes style) -->
  <g transform="translate(512,512) rotate(-30)">
    <!-- Main body -->
    <path d="M-12,40 L-12,-120 L-8,-120 L0,-180 L8,-120 L12,-120 L12,40 Z" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <!-- Luminous circle (Mercedes) -->
    <circle cx="0" cy="-80" r="25" fill="#98ff98"/>
    <circle cx="0" cy="-80" r="18" fill="#c0c0c0"/>
  </g>

  <!-- Minute hand -->
  <g transform="translate(512,512) rotate(60)">
    <path d="M-8,50 L-8,-280 L0,-320 L8,-280 L8,50 Z" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <!-- Luminous fill -->
    <rect x="-5" y="-260" width="10" height="180" fill="#98ff98"/>
  </g>

  <!-- Seconds hand (orange with lollipop) -->
  <g transform="translate(512,512) rotate(150)">
    <!-- Counterweight -->
    <rect x="-4" y="30" width="8" height="80" fill="#ff6b35"/>
    <!-- Main shaft -->
    <rect x="-2" y="-340" width="4" height="380" fill="#ff6b35"/>
    <!-- Lollipop circle -->
    <circle cx="0" cy="-300" r="20" fill="none" stroke="#ff6b35" stroke-width="4"/>
  </g>

  <!-- Center cap -->
  <circle cx="512" cy="512" r="18" fill="#404040"/>
  <circle cx="512" cy="512" r="12" fill="#606060"/>
  <circle cx="512" cy="512" r="6" fill="#808080"/>
</svg>
